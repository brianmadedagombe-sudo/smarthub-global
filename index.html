<html lang="en">

    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <meta name="mobile-web-app-capable" content="yes" />
    <title>SmartHub Global: All-in-One Super App for Business, Creators and Gamers</title>
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SmartHub Global" />
    <meta property="og:title" content="SmartHub Global: All-in-One Super App" />
    <meta property="og:description" content="Invoicing, AI content, storefronts, local services, QR codes, AI pitches, a gamer hub with tournaments, and network tools in one app." />

    <script>
      // Apply saved theme before first paint to avoid a flash of the wrong theme.
      try {
        var raw = localStorage.getItem('smarthub_global_v1');
        var theme = raw ? (JSON.parse(raw).theme) : 'dark';
        if (theme === 'dark') document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
      }
    </script>
  </body>
</html>
